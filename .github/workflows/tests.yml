name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fxq "VERSION = \"$version\"" ytd.py; then
            echo "Tag version ${GITHUB_REF_NAME} does not match VERSION in ytd.py" >&2
            exit 1
          fi
          release_dir="ytd-${GITHUB_REF_NAME}"
          mkdir "$release_dir"
          cp ytd.py install.sh README.md "$release_dir/"
          chmod +x "$release_dir/install.sh"
          tar -czf "${release_dir}.tar.gz" "$release_dir"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ytd-${GITHUB_REF_NAME}.tar.gz" \
            --title "YTD ${GITHUB_REF_NAME}" \
            --generate-notes
